_target_: navsim.agents.sparsedrive.sparsedrive_agent.SparseDriveAgent
_convert_: 'all'

config:
  _target_: navsim.agents.sparsedrive.sparsedrive_config.SparseDriveConfig
  _convert_: 'all'

  foresight_config: ${oc.env:FORESIGHT_ROOT}/projects/configs/sparsedrive_r50_stage2_navsim_planonly.py
  foresight_pretrained: ${oc.env:FORESIGHT_ROOT}/ckpt/sparsedrive_stage1.pth

  num_history_frames: 4
  num_future_poses: 8

  cam_names:
    - cam_f0
    - cam_l0
    - cam_l2
    - cam_r0
    - cam_r2
    - cam_b0

  image_target_size:
    - 256
    - 704

  driving_command_dim: 4

  use_planning_loss: True
  use_detection_loss: False
  use_motion_loss: False
  use_map_loss: False

  # Stage-1 NavSim: set freeze_perception=False to actually train det/map
  # heads against the real GT plumbed in compute_targets. Default True
  # keeps the planning-only minS2 freeze.
  freeze_perception: True
  motion_fut_ts: 16
  map_roi: [30.0, 60.0]
  map_num_sample: 20

  lr: 1.0e-4
  weight_decay: 0.0
  lr_steps: [50, 75]
  optimizer_type: AdamW
  scheduler_type: MultiStepLR

checkpoint_path: null
lr: 1.0e-4
